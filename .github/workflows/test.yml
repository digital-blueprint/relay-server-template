name: Test

on:
    pull_request:
    push:
    workflow_dispatch:

env:
    COMPOSER_CACHE_DIR: /tmp/_composer_cache

jobs:
    unit-tests:
        name: Tests for php${{ matrix.php-versions }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: ["8.2", "8.3", "8.4", "8.5"]
        steps:
            - name: Set up php${{ matrix.php-versions }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: ctype,curl,dom,gd,iconv,intl,json,mbstring,openssl,posix,sqlite,xml,zip,gmp
                  coverage: xdebug
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Cache composer cache directory
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.COMPOSER_CACHE_DIR }}
                  key: composer-cache
            - name: Unit tests
              run: |
                  composer install
                  composer test

    linting:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Set up php${{ matrix.php-versions }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.2"
                  extensions: ctype,curl,dom,gd,iconv,intl,json,mbstring,openssl,posix,sqlite,xml,zip,gmp
                  coverage: xdebug
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Cache composer cache directory
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.COMPOSER_CACHE_DIR }}
                  key: composer-cache
            - name: Unit tests
              run: |
                  composer install
                  result=0
                  composer run cs || result=1
                  composer run phpstan || result=1
                  exit $result

    deploy:
        runs-on: ubuntu-latest
        needs: [unit-tests, linting]
        if: github.ref == 'refs/heads/main'
        environment: ${{ github.ref_name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Deploy and wait for completion
              if: github.ref == 'refs/heads/main'
              uses: digital-blueprint/gitlab-pipeline-trigger-action@9ce6377a88205c23d9978fd64b6fb0bef7320be4 # v1.4.3
              with:
                  host: "gitlab.tugraz.at"
                  trigger_token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
                  access_token: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
                  id: "21238"
                  ref: "main"
                  variables: '{"UPSTREAM_PROJECT_PATH":"dbp/relay/dbp-relay-server-template","UPSTREAM_COMMIT_BRANCH":"${{ github.ref_name }}","UPSTREAM_COMMIT_SHA":"${{ github.ref_name }}"}'
